<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘도 힘내세요!</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="glow-text" id="main-text">오늘도 힘내세요!</h1>
        <button id="next-btn" class="next-button">다음 문장 보기</button>
    </div>

    <script>
        const messages = [
            "오늘도 힘내세요!",
            "당신의 열정을 응원합니다.",
            "작은 시작이 큰 변화를 만듭니다.",
            "오늘도 빛나는 하루 되세요!",
            "포기하지 마세요, 거의 다 왔어요!"
        ];

        const gradients = [
            "linear-gradient(135deg, #f5f7fa 0%, #dcdde1 100%)",
            "linear-gradient(135deg, #e0f7fa 0%, #80deea 100%)",
            "linear-gradient(135deg, #f3e5f5 0%, #ce93d8 100%)",
            "linear-gradient(135deg, #e8f5e9 0%, #a5d6a7 100%)",
            "linear-gradient(135deg, #fff3e0 0%, #ffcc80 100%)"
        ];

        let currentIndex = 0;
        
        const mainText = document.getElementById('main-text');
        const nextBtn = document.getElementById('next-btn');

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % messages.length;
            mainText.textContent = messages[currentIndex];
            document.body.style.background = gradients[currentIndex];
            document.body.style.backgroundSize = "400% 400%";
        });
    </script>
</body>
</html>
